name: Secure Container CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest

      - name: Install Conftest
        run: |
          VERSION=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest \
            | grep '"tag_name":' \
            | cut -d '"' -f 4)

          curl -L \
            "https://github.com/open-policy-agent/conftest/releases/download/${VERSION}/conftest_${VERSION#v}_Linux_x86_64.tar.gz" \
            -o conftest.tar.gz

          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Validate Dockerfile security policies
        run: |
          conftest test Dockerfile \
            --policy policies/ \
            --parser dockerfile

      - name: Build Docker image
        run: |
          docker build -t secure-devsecops-api .